name: Spears
version: '${version}'
main: com.spears.SpearsPlugin
api-version: '1.20'
description: Diamond and netherite spears with spear reach and the Lunge enchantment.
author: you
commands:
  spear:
    description: Spear admin command
    usage: /spear <give|book|lunge|reload>
    aliases: [spears]
permissions:
  spears.admin:
    default: op
  spears.use:
    default: true
  spears.craft:
    default: true
